<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字逻辑课程设计 — 模块关系图（Visio风格）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    background: #e8ecf1;
    padding: 20px;
  }
  .page {
    background: #fff;
    width: 1100px;
    margin: 0 auto 30px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    padding: 24px 20px 20px;
    page-break-after: always;
  }
  .page-title {
    font-size: 16px;
    font-weight: bold;
    color: #1a1a1a;
    border-bottom: 2px solid #2b579a;
    padding-bottom: 6px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .page-title .num {
    background: #2b579a;
    color: #fff;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  svg { display: block; margin: 0 auto; }

  /* ===== 打印适配 ===== */
  @media print {
    body { background: #fff; padding: 0; }
    .page { box-shadow: none; margin: 0; page-break-after: always; width: 100%; }
  }
</style>
</head>
<body>

<!-- ==================== 图1: 层次模块关系图 ==================== -->
<div class="page">
  <div class="page-title"><span class="num">1</span> 系统层次模块关系图</div>

        <stop offset="0%" stop-color="#e8f5e9"/><stop offset="100%" stop-color="#81c784"/>

        <stop offset="0%" stop-color="#ede7f6"/><stop offset="100%" stop-color="#b39ddb"/>

    <!-- 背景网格 (Visio风格) -->

    <rect width="1050" height="520" fill="url(#grid)" opacity="0.4"/>

    <!-- ===== 顶部大框: main ===== -->

    <rect x="850" y="18" width="170" height="26" rx="6" fill="#2b579a"/>
    <text x="935" y="36" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">main（顶层系统）</text>

    <!-- model1 时钟分频 -->

    <text x="880" y="124" text-anchor="middle" fill="#546e7a" font-size="10">Status Display</text>

    <!-- ===== 中部大框: TEST ===== -->

    <rect x="780" y="168" width="190" height="26" rx="6" fill="#e65100"/>
    <text x="875" y="186" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">TEST（游戏逻辑系统）</text>

    <!-- model2 -->
    <rect x="70" y="210" width="195" height="85" rx="7" fill="url(#gradM2)" stroke="#2e7d32" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="167" y="238" text-anchor="middle" fill="#1b5e20" font-size="14" font-weight="bold">model2</text>
    <text x="167" y="260" text-anchor="middle" fill="#2e7d32" font-size="12">随机数生成器</text>
    <text x="167" y="280" text-anchor="middle" fill="#546e7a" font-size="10">LFSR Random</text>

    <!-- model4 -->
    <rect x="70" y="315" width="195" height="85" rx="7" fill="url(#gradM4)" stroke="#2e7d32" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="167" y="343" text-anchor="middle" fill="#1b5e20" font-size="14" font-weight="bold">model4</text>
    <text x="167" y="365" text-anchor="middle" fill="#2e7d32" font-size="12">障碍物管理</text>

    <!-- model3 -->

    <text x="392" y="238" text-anchor="middle" fill="#e65100" font-size="14" font-weight="bold">model3</text>
    <text x="392" y="260" text-anchor="middle" fill="#f57f17" font-size="12">小车控制器</text>
    <text x="392" y="280" text-anchor="middle" fill="#546e7a" font-size="10">Car Controller</text>

    <text x="392" y="343" text-anchor="middle" fill="#bf360c" font-size="14" font-weight="bold">model5</text>
    <text x="392" y="365" text-anchor="middle" fill="#d84315" font-size="12">碰撞检测</text>
    <text x="392" y="385" text-anchor="middle" fill="#546e7a" font-size="10">Collision Detect</text>

    <!-- model6 (核心，放中间) -->

    <text x="617" y="322" text-anchor="middle" fill="#546e7a" font-size="10">Game FSM</text>

    <!-- model7 -->
    <rect x="745" y="225" width="195" height="85" rx="7" fill="url(#gradM7)" stroke="#00695c" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="842" y="253" text-anchor="middle" fill="#004d40" font-size="14" font-weight="bold">model7</text>
    <text x="842" y="275" text-anchor="middle" fill="#00695c" font-size="12">游戏计分器</text>
    <text x="842" y="295" text-anchor="middle" fill="#546e7a" font-size="10">Score Counter</text>

    <!-- model8 -->
    <rect x="745" y="330" width="195" height="85" rx="7" fill="url(#gradM8)" stroke="#e65100" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="842" y="358" text-anchor="middle" fill="#bf360c" font-size="14" font-weight="bold">model8</text>
    <text x="842" y="380" text-anchor="middle" fill="#e65100" font-size="12">LED矩阵输出源</text>
    <text x="842" y="400" text-anchor="middle" fill="#546e7a" font-size="10">LED Matrix Driver</text>

    <!-- ===== 连线 ===== -->

    <!-- model1 → TEST (时钟) -->
    <path d="M140,135 L140,200" stroke="#1565c0" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)" stroke-dasharray="6,2"/>
    <rect x="147" y="155" width="70" height="16" rx="4" fill="#1565c0" opacity="0.85"/>
    <text x="182" y="167" text-anchor="middle" fill="#fff" font-size="9">时钟信号</text>

    <!-- model1 → GameState (时钟) -->
    <path d="M880,135 L880,200" stroke="#7b1fa2" stroke-width="2" fill="none" marker-end="url(#arrowBlue)" stroke-dasharray="6,2"/>

    <!-- model2 → model4 -->
    <path d="M167,295 L167,310" stroke="#2e7d32" stroke-width="2.2" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="174" y="298" width="92" height="16" rx="4" fill="#2e7d32" opacity="0.85"/>

    <path d="M265,357 L290,357" stroke="#bf360c" stroke-width="2.2" fill="none" marker-end="url(#arrowBlue)"/>

    <text x="308" y="354" text-anchor="middle" fill="#fff" font-size="9">obs_pos</text>

    <rect x="399" y="298" width="78" height="16" rx="4" fill="#f57f17" opacity="0.85"/>
    <text x="438" y="310" text-anchor="middle" fill="#fff" font-size="9">car_pos</text>

    <rect x="486" y="338" width="52" height="16" rx="4" fill="#d84315" opacity="0.9"/>
    <text x="512" y="350" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">hit</text>

    <!-- model6 → model3 -->
    <path d="M520,278 L495,270" stroke="#6a1b9a" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="468" y="258" width="60" height="16" rx="4" fill="#6a1b9a" opacity="0.85"/>
    <text x="498" y="270" text-anchor="middle" fill="#fff" font-size="9">is_gaming</text>

    <!-- model6 → model4 -->
    <path d="M520,310 L270,370" stroke="#6a1b9a" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="360" y="335" width="60" height="16" rx="4" fill="#6a1b9a" opacity="0.85"/>
    <text x="390" y="347" text-anchor="middle" fill="#fff" font-size="9">is_gaming</text>

    <!-- model6 → model7 -->
    <path d="M715,297 L740,280" stroke="#6a1b9a" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="710" y="278" width="40" height="16" rx="4" fill="#6a1b9a" opacity="0.85"/>
    <text x="730" y="290" text-anchor="middle" fill="#fff" font-size="9">en</text>

    <!-- model4 → model8 -->
    <path d="M265,370 L740,370" stroke="#2e7d32" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="450" y="358" width="80" height="16" rx="4" fill="#2e7d32" opacity="0.85"/>
    <text x="490" y="370" text-anchor="middle" fill="#fff" font-size="9">obs_bitmap</text>

    <!-- model3 → model8 -->
    <path d="M490,260 L740,340" stroke="#f57f17" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="570" y="293" width="70" height="16" rx="4" fill="#f57f17" opacity="0.85"/>
    <text x="605" y="305" text-anchor="middle" fill="#fff" font-size="9">car_bitmap</text>

    <!-- model7 → model8 -->
    <path d="M842,310 L842,325" stroke="#00695c" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="849" y="313" width="56" height="16" rx="4" fill="#00695c" opacity="0.85"/>
    <text x="877" y="325" text-anchor="middle" fill="#fff" font-size="9">score</text>

    <!-- model6 → GameState -->
    <path d="M617,345 L617,400 L880,400 L880,140" stroke="#6a1b9a" stroke-width="2.2" fill="none" marker-end="url(#arrowBlue)" stroke-dasharray="7,3"/>
    <rect x="720" y="388" width="72" height="16" rx="4" fill="#6a1b9a" opacity="0.85"/>

    <!-- model8 → LED (外部) -->
    <rect x="940" y="355" width="70" height="34" rx="6" fill="#37474f"/>
    <text x="975" y="369" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">LED</text>
    <text x="975" y="383" text-anchor="middle" fill="#b0bec5" font-size="9">8×8 矩阵</text>
    <path d="M940,372 L940,372" stroke="#37474f" stroke-width="2"/> <!-- 不可见起点 -->
    <path d="M940,372 L935,372" stroke="#e65100" stroke-width="2.2" fill="none" marker-end="url(#arrowBlue)"/>

    <!-- 图例 -->
    <rect x="60" y="430" width="12" height="12" rx="2" fill="url(#gradM6)"/>
    <text x="78" y="441" fill="#333" font-size="11">核心控制模块</text>
    <rect x="200" y="430" width="12" height="12" rx="2" fill="url(#gradM1)"/>
    <text x="218" y="441" fill="#333" font-size="11">时钟模块</text>
    <rect x="320" y="430" width="12" height="12" rx="2" fill="url(#gradM2)"/>
    <text x="338" y="441" fill="#333" font-size="11">数据源模块</text>
    <rect x="460" y="430" width="12" height="12" rx="2" fill="url(#gradM5)"/>
    <text x="478" y="441" fill="#333" font-size="11">检测模块</text>
    <rect x="580" y="430" width="12" height="12" rx="2" fill="url(#gradM8)"/>
    <text x="598" y="441" fill="#333" font-size="11">输出模块</text>
    <line x1="700" y1="436" x2="740" y2="436" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="6,2"/>

    <text x="878" y="441" fill="#333" font-size="11">数据线</text>

  </svg>
</div>

<!-- ==================== 图2: 信号连接详图 ==================== -->
<div class="page">

  <svg viewBox="0 0 1050 580" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="sh2"><feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.14"/></filter>

        <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
      </marker>
      <marker id="arwRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
      </marker>
    </defs>

    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8e8e8" stroke-width="0.3"/>
    </pattern>
    <rect width="1050" height="580" fill="url(#grid2)" opacity="0.6"/>

    <!-- 系统时钟 -->
    <ellipse cx="190" cy="50" rx="55" ry="22" fill="#37474f"/>

    <!-- model4 -->
